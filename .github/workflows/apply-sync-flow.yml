name: Validate sync flow candidate
on:
  push:
    branches: [fix/september-2026-profile-mvp]
    paths: [.maintenance/sync-upload.json]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify patch checksum and source scope
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          data=json.loads(pathlib.Path('.maintenance/sync-upload.json').read_text())
          patch=lzma.decompress(base64.b64decode(data['patch'],validate=True))
          assert hashlib.sha256(patch).hexdigest()==data['sha256']
          actual=subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode()
          files={line.split('\t',2)[2] for line in actual.splitlines()}
          assert files==set(data['files'])
          assert all(p.startswith(('src/main/java/com/revalclan/','src/test/java/com/revalclan/')) for p in files)
          assert not any('..' in p or p.endswith(('CollectionLogSyncButton.java','DiaryNotifier.java')) for p in files)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Compile and run full plugin regression suite
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: gradle --no-daemon clean test jar
      - name: Commit tested source on candidate branch only
        run: |
          test "$GITHUB_REF_NAME" = 'fix/september-2026-profile-mvp'
          git diff --check
          git add src/main/java src/test/java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add coalesced automatic progress syncing and saved-state tab refresh'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-flow-results
          path: |
            build/reports/tests
            build/test-results
            build/reports/ui
          if-no-files-found: ignore
          retention-days: 7
