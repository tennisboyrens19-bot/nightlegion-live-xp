name: Reval sync reference audit
on:
  push:
    branches: [fix/september-2026-profile-mvp]
    paths: [.github/workflows/reval-sync-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public reference source and catalogue only
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          out = pathlib.Path('reference'); out.mkdir()
          refs = {'reval-pinned': '6033d3188b18d34f4bd4c28e6cf7986c8b95f0f9', 'reval-pr16622': '179faa521b14e4541151effd0f5d28f12ec89597'}
          manifest = {}
          for name, sha in refs.items():
              url = f'https://codeload.github.com/revalOSRS/reval-cc-plugin/tar.gz/{sha}'
              with urllib.request.urlopen(url, timeout=40) as response: raw = response.read()
              (out / (name + '.tar.gz')).write_bytes(raw)
              manifest[name] = {'commit': sha, 'sha256': hashlib.sha256(raw).hexdigest()}
          try:
              req = urllib.request.Request('https://api.revalosrs.ee/plugin/points', headers={'User-Agent': 'RuneLite-RevalClan-Plugin/2.18.7', 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=20) as response: raw = response.read()
              data = json.loads(raw)
              assert data.get('status') == 'success' and isinstance(data.get('data'), dict)
              (out / 'reval-public-points.json').write_bytes(raw)
              manifest['catalogue'] = {'sha256': hashlib.sha256(raw).hexdigest()}
          except Exception as error:
              manifest['catalogue'] = {'error': str(error)}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reval-public-sync-reference
          path: reference
          retention-days: 7
