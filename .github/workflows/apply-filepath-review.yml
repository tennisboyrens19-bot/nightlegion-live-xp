name: Apply RuneLite Filepath review fix
on:
  push:
    branches: [fix/filepath-review-2026-09-18]
    paths: [.maintenance/apply_filepath_review.py, .github/workflows/apply-filepath-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply reviewer-requested Filepath migration
        run: python3 .maintenance/apply_filepath_review.py
      - name: Build, test, and verify source/file I/O policy
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: |
          gradle --no-daemon clean test jar
          python3 tools/reval_source.py
          if grep -RInE 'import java\.io\.File;|import java\.nio\.file\.(Files|Path);|new File\(|Files\.|\.toPath\(' src/main/java; then
            echo 'Direct filesystem access remains.' >&2
            exit 1
          fi
      - name: Commit tested runtime fix only
        run: |
          test "$GITHUB_REF_NAME" = 'fix/filepath-review-2026-09-18'
          git diff --check
          git add \
            src/main/java/com/revalclan/RevalClanPlugin.java \
            src/main/java/com/revalclan/session/SessionStore.java \
            tools/reval_source.py \
            runelite-plugin.properties \
            .github/workflows/exact-release-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use RuneLite Filepath for NightLegion session persistence'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filepath-review-results
          path: |
            build/test-results
            build/reports/tests
            build/source-parity.json
            build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 7
