name: Adapt exact Live On to NightLegion

on:
  push:
    branches:
      - liveon-exact-nightlegion-v2

permissions:
  contents: write

jobs:
  adapt:
    if: ${{ !contains(github.event.head_commit.message || '', '[adapt-nightlegion]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liveon-exact-nightlegion-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Adapt exact source
        run: python scripts/adapt_exact_nightlegion.py
      - name: Preserve Lombok Data annotation
        run: |
          sed -i 's/import lombok.Date;/import lombok.Data;/' src/main/java/com/liveon/DropRarityService.java
          sed -i 's/@Date/@Data/g' src/main/java/com/liveon/DropRarityService.java
      - name: Build adapted plugin
        run: gradle clean build --stacktrace
      - name: Commit final adapted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources runelite-plugin.properties
          if git diff --cached --quiet; then
            echo "Exact NightLegion adaptation already applied."
            exit 0
          fi
          git commit -m "[adapt-nightlegion] Activate exact Live On NightLegion implementation"
          git push origin HEAD:liveon-exact-nightlegion-v2
