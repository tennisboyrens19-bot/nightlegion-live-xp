name: Adapt exact Live On to NightLegion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liveon-exact-nightlegion-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Protect Java Data identifiers from UI translation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/adapt_exact_nightlegion.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('(\"Jogador\", \"Player\"), (\"Data\", \"Date\"),', '(\"Jogador\", \"Player\"),')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Adapt exact source
        run: python scripts/adapt_exact_nightlegion.py
      - name: Build adapted plugin
        run: gradle clean build --stacktrace
