name: Import published Reval runtime
on:
  push:
    branches: [fix/reval-exact-179faa]
    paths: [tools/reval_source.py]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'tennisboyrens19-bot/nightlegion-live-xp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Import checksum-pinned client, identity and token boundary only
        run: python3 tools/reval_source.py --apply
      - name: Compile and test the complete original client
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: gradle --no-daemon clean test jar
      - name: Verify every runtime source file against pinned Reval
        run: python3 tools/reval_source.py
      - name: Commit validated runtime to candidate branch only
        run: |
          test "$GITHUB_REF_NAME" = 'fix/reval-exact-179faa'
          git add src build.gradle settings.gradle runelite-plugin.properties LICENSE LICENSES gradlew gradlew.bat gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace adapted plugin with Reval 179faa source plus NightLegion identity and token boundary'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-reval-verification
          path: |
            build/reports/tests
            build/test-results
            build/source-parity.json
            build/libs/*.jar
          if-no-files-found: ignore
          retention-days: 7
