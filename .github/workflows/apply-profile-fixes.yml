name: Apply tested plugin fixes
on:
  push:
    branches: [fix/september-2026-profile-mvp]
    paths: [.maintenance/apply_plugin.py]
permissions:
  contents: write
concurrency:
  group: apply-profile-fixes
  cancel-in-progress: true
jobs:
  apply:
    if: github.repository == 'tennisboyrens19-bot/nightlegion-live-xp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply explicit source edits
        run: python3 .maintenance/apply_plugin.py
      - name: Compile the complete plugin and run regression tests
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        run: gradle --no-daemon clean test
      - name: Commit tested files to feature branch only
        run: |
          test "$GITHUB_REF_NAME" = 'fix/september-2026-profile-mvp'
          git diff --check
          git add src/main/java src/test/java build.gradle runelite-plugin.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix plugin profile connection, display and monthly MVP integration'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-profile-results
          path: |
            build/reports/tests
            build/test-results
            build/reports/ui
          if-no-files-found: ignore
          retention-days: 7
